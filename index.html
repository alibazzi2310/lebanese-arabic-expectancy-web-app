<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<title>Lebanese Arabic — Expectancy List</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0e13'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%2335d0a5' font-family='serif'%3E%D8%B4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="topbar-row">
    <div class="counts">
      <span class="count" id="countLearned">0</span><span class="count-sep">/</span><span class="count-total" id="countTotal">0</span>
      <span class="count-label">learned</span>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-expanded="false">⚙</button>
  </div>
</header>

<div class="panel" id="panel" hidden>
  <label class="opt"><input type="checkbox" id="optHarakat" checked><span>Show vowel marks (harakat)</span></label>
  <label class="opt"><input type="checkbox" id="optEnFirst"><span>English first (production practice)</span></label>
  <button class="reset-btn" id="resetBtn">Reset all progress</button>
</div>

<main class="feed" id="feed" tabindex="-1"></main>

<div class="hint" id="hint">
  <p>Tap the card to reveal · swipe up for the next word</p>
</div>

<template id="cardTpl">
  <article class="card">
    <div class="card-inner">
      <div class="card-meta">
        <span class="rank"></span>
        <span class="meta-right">
          <span class="form" hidden></span>
          <span class="pos"></span>
        </span>
      </div>

      <div class="card-body">
        <div class="prompt">
          <div class="ar" dir="rtl" lang="ar"></div>
          <div class="en-prompt"></div>
        </div>

        <div class="answer" aria-hidden="true">
          <div class="answer-main"></div>
          <p class="pron" hidden></p>
          <div class="example">
            <div class="example-ar" dir="rtl" lang="ar"></div>
            <div class="example-en"></div>
          </div>
          <p class="note"></p>
        </div>

        <div class="tap-cue">tap to reveal</div>
      </div>

      <div class="actions" aria-hidden="true">
        <button class="btn btn-again" data-grade="again">Again</button>
        <button class="btn btn-good" data-grade="good">Got it</button>
      </div>
    </div>
  </article>
</template>

<script src="assets/app.js"></script>
</body>
</html>
